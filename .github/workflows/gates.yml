name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.18, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test
      - run: node --test test/p0.test.mjs
      - run: node scripts/validate-mission.mjs .cairn/missions/000-bootstrap
      - run: node scripts/validate-mission.mjs .cairn/missions/001-method-pack
      - run: node scripts/validate-mission.mjs .cairn/missions/002-completion-integrity
      - run: node scripts/check-decisions.mjs
      - run: node scripts/check-enforcement.mjs
      - run: node scripts/check-targets.mjs .cairn/missions/001-method-pack
      - run: node scripts/check-targets.mjs .cairn/missions/002-completion-integrity
      - run: node src/cli.ts reconcile --mission .cairn/missions/002-completion-integrity
      - run: node scripts/check-bilingual.mjs
      - run: node scripts/check-workflow.mjs
      - run: node scripts/check-example.mjs --example method/examples/0001-docs-tick
      - run: node scripts/check-method.mjs --playbook
      - run: node scripts/check-method.mjs --products --strict

  windows-gate-shell:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test test/gates.test.ts
